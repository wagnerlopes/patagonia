<!DOCTYPE html>

<html lang="en" data-bs-theme="auto" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Client for Map Api" />
  <meta name="author" content="Wagnersoft - WL"/>
  <meta name="generator" content="Astro v5.13.2" />
  <meta name="theme-color" content="#712cf9" />

  <title>Patagonia · WagnerSoft v0.0.1-alpha</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> 
  <link rel="stylesheet" type="text/css" media="all" href="../css/patagonia.css" th:href="@{/css/patagonia.css}"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  
  <style>
    #map {
      height: 500px;
      width: 100%;
    }
  </style>
  
</head>

<body class="m-3">

  <header class="py-2 mb-2 border-bottom">
   <div class="container d-flex flex-wrap justify-content-center">
    <span class="fs-4">Brasil GeoMap</span>
    <i class="bi bi-globe-americas"></i>
   </div>
  </header>

  <div class="form-group row">
  
    <label for="localId" class="col-sm-1 form-label text-end">Origem (ID):</label>
    <div class="col-sm-2">
      <div class="input-group input-group-sm">
        <input type="text" class="form-control form-control-sm" placeholder="digite o id" id="origemId">
        <button class="btn btn-primary btn-sm" type="button" id="btSearch1">
          <i class="bi bi-geo-alt"></i>
        </button>
      </div>
    </div>
    
    <label for="localId" class="col-sm-1 form-label text-end">Destino (ID):</label>
    <div class="col-sm-2">
      <div class="input-group input-group-sm">
        <input type="text" class="form-control form-control-sm" placeholder="digite o id" id="destinoId">
        <button class="btn btn-primary btn-sm" type="button" id="btSearch2">
          <i class="bi bi-geo-alt"></i>
        </button>
      </div>
    </div>

    <div class="col-sm-4">
      <button class="btn btn-outline-primary btn-sm" type="button" id="btCalc"><i class="bi bi-rulers"></i> Distância</button>
    </div>
    
  </div>

  <hr/>
  
  <div class="form-group row">
  
    <label for="lat1" class="col-sm-1 form-label text-end">Ponto 1:</label>
    <div class="col-sm-4">
      <div class="input-group input-group-sm">
        <span class="input-group-text">Lat</span>
        <input type="text" class="form-control form-control-sm" id="lat1">
        <span class="input-group-text">Lon</span>
        <input type="text" class="form-control form-control-sm" id="lon1">
      </div>
    </div>

    <div class="col-sm-4">
      <button class="btn btn-outline-primary btn-sm" type="button" id="btCalcDist"><i class="bi bi-rulers"></i> Distância</button>
    </div>

  </div>
      
  <div class="form-group row">

    <label for="lat2" class="col-sm-1 form-label text-end">Ponto 2:</label>
    <div class="col-sm-4">
      <div class="input-group input-group-sm">
        <span class="input-group-text">Lat</span>
        <input type="text" class="form-control form-control-sm" id="lat2">
        <span class="input-group-text">Lon</span>
        <input type="text" class="form-control form-control-sm" id="lon2">
      </div>
    </div>

    <div class="col-sm-4">
      <button class="btn btn-outline-danger btn-sm" id="btLimpar"><i class="bi bi-trash"></i> Limpar</button>
    </div>

  </div>
    
  <hr/>

  <div id="map"></div>

  <footer class="border-top mt-3">
     <p class="text-center text-body-secondary"> &copy; 2026 WagnerSoft IT Solutions.</p>
  </footer>

  <!-- JS do Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="../js/geo.js" th:src="@{/js/geo.js}" ></script>

</body>

</html>
