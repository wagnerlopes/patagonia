<!DOCTYPE html>

<html lang="en" data-bs-theme="auto" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Mapa de localidades brasileiras" />
  <meta name="author" content="Wagnersoft - WL"/>
  <meta name="theme-color" content="#1e3a8a" />

  <title>Patagônia · WagnerSoft</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> 
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/patagonia.css" type="text/css" media="all" th:href="@{/css/patagonia.css}"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  
</head>

<body class="m-3">

  <header class="py-2 mb-2 border-bottom">
   <div class="container d-flex flex-wrap justify-content-center">
    <h2>Brasil GeoInformação</h2>
    <i class="bi bi-globe-americas"></i>
   </div>
  </header>

  <div class="card shadow-sm border-0 pb-1">
    
    <div class="card-body">

      <h5 class="card-title mb-2">Consulta de Localidades</h5>

      <div class="row g-2 align-items-end">

        <div class="col-md-4 form-group">
          <div class="input-group input-group-sm">
            <span class="input-group-text">Origem</span>
            <select id="munOri" name="munOri" class="form-select form-select-sm">
              <option value="">Selecione um município...</option>
              <option th:each="m : ${allMunicipios}" th:value="${m.key}" th:text="${m.value}"></option>
            </select>
          </div>
        </div>
        
        <div class="col-md-4 form-group">
          <div class="input-group input-group-sm">
            <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
            <select id="origemId" name="origemId" class="form-select form-select-sm"></select>
          </div>
        </div>

      </div>
    
      <div class="row g-2 align-items-end">
      
        <div class="col-md-4 form-group">
          <div class="input-group input-group-sm">
            <span class="input-group-text">Destino</span>
            <select id="munDes" name="munDes" class="form-select form-select-sm">
              <option value="">Selecione um município...</option>
              <option th:each="m : ${allMunicipios}" th:value="${m.key}" th:text="${m.value}"></option>
            </select>
          </div>
        </div>

        <div class="col-md-4 form-group">
          <div class="input-group input-group-sm">
            <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
            <select id="destinoId" name="destinoId" class="form-select form-select-sm"></select>
          </div>
        </div>

        <div class="col-sm-4">
          <button class="btn btn-outline-primary btn-sm" type="button" id="btCalc" title="Medir distância"><i class="bi bi-rulers"></i> Distância</button>
        </div>

      </div>
           
    </div>
       
  </div>
  
  <div class="card shadow-sm border-0 pb-1">
    
    <div class="card-body">

      <h5 class="card-title mb-2">Locais Selecionados (Clique no mapa)</h5>

      <div class="row g-2 align-items-end">
  
        <div class="col-sm-4 form-group">
          <div class="input-group input-group-sm">
            <span class="input-group-text">Lat1</span>
            <input type="text" class="form-control form-control-sm" id="lat1">
            <span class="input-group-text">Lon1</span>
            <input type="text" class="form-control form-control-sm" id="lon1">
          </div>
        </div>

        <div class="col-sm-4">
          <button class="btn btn-outline-primary btn-sm" type="button" id="btCalcDist" title="Medir distância e azimute"><i class="bi bi-rulers"></i> Distância</button>
        </div>

      </div>
      
      <div class="row g-2 align-items-end">

        <div class="col-sm-4 form-group">
          <div class="input-group input-group-sm">
            <span class="input-group-text">Lat2</span>
            <input type="text" class="form-control form-control-sm" id="lat2">
            <span class="input-group-text">Lon2</span>
            <input type="text" class="form-control form-control-sm" id="lon2">
          </div>
        </div>

        <div class="col-sm-4">
        </div>

      </div>

    </div>    

  </div>
  
  
  <div class="card shadow-sm border-0 mt-4">

    <div class="card-header bg-primary text-white d-flex align-items-center">
      <h4 class="mb-0 g-3">
        <i class="bi bi-pin-map"></i>
        <span class="mx-3">Mapa de Localidades</span>
      </h4>
      <button class="btn btn-danger btn-sm ms-auto" id="btLimpar" title="Limpar pontos no mapa"><i class="bi bi-trash"></i> Limpar</button>
    </div>

    <div class="card-body">
       <div id="map"></div>
    </div>

  </div>

  <footer class="border-top">
     <p class="text-center text-body-secondary"> &copy; 2026 WagnerSoft IT Solutions.<br/>v0.2.0-ALPHA</p>
  </footer>

  <!-- JS do Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="../js/geomap.js" th:src="@{/js/geomap.js}"></script>

</body>

</html>
